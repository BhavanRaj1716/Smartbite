<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBite — Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ══ ADMIN LOGIN ══ -->
  <div id="adminLoginScreen">
    <div class="adminLoginCard">
      <h1 class="adminLoginTitle">SmartBite Admin</h1>
      <p style="color:#aaa; margin-bottom: 30px; font-size:0.9rem;">Restricted access — authorised personnel only</p>
      <button id="adminGoogleBtn">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
      <p id="adminLoginError"></p>
    </div>
  </div>

  <!-- ══ ADMIN DASHBOARD ══ -->
  <div id="adminDashboard" style="display:none;">

    <header class="adminHeader">
      <div class="adminHeaderLeft">
        <div class="adminHeaderDot"></div>
        <span class="adminHeaderTitle">SMARTBITE — ADMIN</span>
      </div>
      <div class="adminHeaderRight">
        <span id="liveClock"></span>
        <span id="adminUserEmail" style="max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
        <button id="adminLogoutBtn">Logout</button>
      </div>
    </header>

    <div class="stats">
      <div class="statBox">
        <h3>Total Orders</h3>
        <p id="totalOrders">0</p>
      </div>
      <div class="statBox">
        <h3>Revenue Today</h3>
        <p id="totalRevenue">₹0</p>
      </div>
      <div class="statBox">
        <h3>UPI Pending</h3>
        <p id="pendingRevenue">₹0</p>
      </div>
      <div class="statBox">
        <h3>Queue Status</h3>
        <p style="color:#A8FF3E;">LIVE</p>
      </div>
    </div>

    <div class="filters">
      <button id="btnAll" class="active">All Active</button>
      <button id="btnPendingPayment">Pending Payment</button>
      <button id="btnPreparing">Preparing</button>
      <button id="btnReady">Ready</button>
      <button id="btnDelivered">Delivered</button>
      <button id="btnCancelled">Cancelled</button>
      <button id="btnToday">Today</button>
      <button id="btnInventory" style="margin-left:auto; border-color:#FFBE00; color:#FFBE00;">📦 Stock Manager</button>
    </div>

    <div id="panelLayout">
      <div id="ordersPanel">
        <div class="panelTitle"><span></span> Order Queue</div>
        <div id="adminOrders"></div>
      </div>
      <div id="historyPanel">
        <div class="panelTitle"><span style="background:#A8FF3E;"></span> Delivered Operations</div>
        <div id="historyOrders"></div>
      </div>
    </div>

    <div id="inventoryPanel">
      <div class="panelTitle"><span style="background:#C850C0;"></span> Stock Manager</div>
      <div class="inventoryGrid" id="inventoryGrid"></div>
    </div>

  </div>

  <div id="toast"></div>
  <script type="module" src="admin.js"></script>

</body>
</html>
